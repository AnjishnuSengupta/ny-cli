name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm ci || npm install
      - name: Version check
        run: npm run check:versions
      - name: Bundle check
        run: npm run check:bundle
      - name: Pack package
        run: npm pack
      - name: Install tarball into clean prefix
        run: |
          mkdir -p /tmp/clean-prefix-${{ matrix.node-version }}
          npm install -g ./*.tgz --prefix /tmp/clean-prefix-${{ matrix.node-version }}
      - name: Verify ny-cli --version
        run: /tmp/clean-prefix-${{ matrix.node-version }}/bin/ny-cli --version
      - name: Verify ny-cli --doctor
        run: /tmp/clean-prefix-${{ matrix.node-version }}/bin/ny-cli --doctor

  verify-root-prefix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Pack package
        run: npm pack
      - name: Install under root-owned prefix as root
        run: |
          sudo mkdir -p /opt/ny-cli-root
          sudo npm install -g ./*.tgz --prefix /opt/ny-cli-root
      - name: Run as normal user
        run: |
          /opt/ny-cli-root/bin/ny-cli --version
          /opt/ny-cli-root/bin/ny-cli --doctor

  build-deb:
    needs: [verify, verify-root-prefix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      
      - name: Get version
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/') ;;
          esac
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts fakeroot build-essential
      
      - name: Build .deb package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          npm run build:fallback
          TARBALL=$(npm pack)
          mkdir -p build/ny-cli-${VERSION}
          cp "$TARBALL" build/ny-cli-${VERSION}/
          cp -r debian build/ny-cli-${VERSION}/
          
          # Update debian changelog version
          cd build/ny-cli-${VERSION}
          sed -i "1s/ny-cli ([^)]*)/ny-cli (${VERSION}-1)/" debian/changelog
          
          # Build the package
          dpkg-buildpackage -us -uc -b
          
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb

  build-rpm:
    needs: [verify, verify-root-prefix]
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/') ;;
          esac
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools nodejs npm
      
      - name: Setup RPM build tree
        run: rpmdev-setuptree
      
      - name: Prepare source from npm pack
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          npm run build:fallback
          TARBALL=$(npm pack)
          
          # Prepare rpmbuild source directory containing tarball
          mkdir -p ny-cli-${VERSION}
          cp "$TARBALL" ny-cli-${VERSION}/
          cp LICENSE README.md ny-cli-${VERSION}/
          tar czf $HOME/rpmbuild/SOURCES/ny-cli-${VERSION}.tar.gz ny-cli-${VERSION}
          
          # Copy and update spec
          cp ny-cli.spec $HOME/rpmbuild/SPECS/
          sed -i "s/^Version:.*/Version:        ${VERSION}/" $HOME/rpmbuild/SPECS/ny-cli.spec
      
      - name: Build RPM
        run: rpmbuild -ba $HOME/rpmbuild/SPECS/ny-cli.spec
      
      - name: Copy RPM to workspace
        run: |
          mkdir -p rpms
          cp $HOME/rpmbuild/RPMS/noarch/*.rpm rpms/ || true
          
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: rpms/*.rpm

  release:
    needs: [build-deb, build-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            deb-package/*.deb
            rpm-package/*.rpm
          generate_release_notes: true
