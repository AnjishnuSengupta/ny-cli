name: Build and Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/') ;;
          esac
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts fakeroot build-essential nodejs npm
      
      - name: Build .deb package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          # Create proper debian source directory
          mkdir -p build/ny-cli-${VERSION}
          cp ny-cli backend.mjs cli-terminal.tsx cli-terminal-fallback.mjs package.json tsconfig.json install.sh LICENSE README.md build/ny-cli-${VERSION}/
          cp -r debian build/ny-cli-${VERSION}/
          
          # Update debian changelog version
          cd build/ny-cli-${VERSION}
          sed -i "1s/ny-cli ([^)]*)/ny-cli (${VERSION}-1)/" debian/changelog
          
          # Install npm dependencies with legacy-peer-deps to resolve ink version conflict
          npm install --omit=dev --ignore-scripts --legacy-peer-deps
          
          # Update rules to skip npm install since we did it
          sed -i 's/npm install.*$/true/' debian/rules
          
          # Build the package
          dpkg-buildpackage -us -uc -b
          
      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: build/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get version
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/') ;;
          esac
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Install build dependencies
        run: dnf install -y rpm-build rpmdevtools nodejs npm
      
      - name: Setup RPM build tree
        run: rpmdev-setuptree
      
      - name: Prepare source and install deps
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          mkdir -p ny-cli-${VERSION}
          cp ny-cli backend.mjs cli-terminal.tsx cli-terminal-fallback.mjs package.json tsconfig.json install.sh LICENSE README.md ny-cli-${VERSION}/
          
          # Install npm dependencies with legacy-peer-deps
          cd ny-cli-${VERSION}
          npm install --omit=dev --ignore-scripts --legacy-peer-deps
          cd ..
          
          # Create tarball with node_modules included
          tar czf $HOME/rpmbuild/SOURCES/ny-cli-${VERSION}.tar.gz ny-cli-${VERSION}
          
          # Copy and update spec
          cp ny-cli.spec $HOME/rpmbuild/SPECS/
          sed -i "s/^Version:.*/Version:        ${VERSION}/" $HOME/rpmbuild/SPECS/ny-cli.spec
          # Skip npm install in spec since we already did it
          sed -i 's/npm install.*$/true/' $HOME/rpmbuild/SPECS/ny-cli.spec
          # Fix the changelog date format
          sed -i 's/Sat Apr 05/Sun Apr 05/g' $HOME/rpmbuild/SPECS/ny-cli.spec
      
      - name: Build RPM
        run: rpmbuild -ba $HOME/rpmbuild/SPECS/ny-cli.spec
      
      - name: Copy RPM to workspace
        run: |
          mkdir -p rpms
          cp $HOME/rpmbuild/RPMS/noarch/*.rpm rpms/ || true
          
      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: rpms/*.rpm

  release:
    needs: [build-deb, build-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            deb-package/*.deb
            rpm-package/*.rpm
          generate_release_notes: true
