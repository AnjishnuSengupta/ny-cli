name: Publish to AUR

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          case "$GITHUB_REF_NAME" in
            v*) VERSION="${GITHUB_REF_NAME#v}" ;;
            *)  VERSION=$(grep '"version"' package.json | head -1 | sed 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/') ;;
          esac
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update PKGBUILD version
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y pacman-package-manager

      - name: Generate .SRCINFO
        run: |
          {
            echo "pkgbase = ny-cli"
            echo -e "\tpkgdesc = Beautiful terminal anime streaming client with artwork display, cloud sync, and watch progress tracking"
            echo -e "\tpkgver = ${{ steps.version.outputs.VERSION }}"
            echo -e "\tpkgrel = 1"
            echo -e "\turl = https://github.com/AnjishnuSengupta/ny-cli"
            echo -e "\tarch = any"
            echo -e "\tlicense = MIT"
            echo -e "\tdepends = nodejs>=20.18.0"
            echo -e "\tdepends = npm"
            echo -e "\toptdepends = mpv: recommended video player with IPC support"
            echo -e "\toptdepends = vlc: alternative video player"
            echo -e "\toptdepends = ffmpeg: stream recording and subtitle muxing"
            echo -e "\toptdepends = webtorrent-cli: torrent streaming and downloading support"
            echo -e "\toptdepends = chafa: terminal image rendering for artwork display"
            echo -e "\tsource = ny-cli-${{ steps.version.outputs.VERSION }}.tar.gz::https://github.com/AnjishnuSengupta/ny-cli/archive/v${{ steps.version.outputs.VERSION }}.tar.gz"
            echo -e "\tsha256sums = SKIP"
            echo ""
            echo "pkgname = ny-cli"
          } > .SRCINFO

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          printf "Host aur.archlinux.org\n  IdentityFile ~/.ssh/aur\n  User aur\n" > ~/.ssh/config

      - name: Push to AUR
        run: |
          git config --global user.name "${{ secrets.AUR_USERNAME }}"
          git config --global user.email "${{ secrets.AUR_EMAIL }}"
          
          # Clone AUR repo
          git clone ssh://aur@aur.archlinux.org/ny-cli.git aur-repo || git init aur-repo
          cd aur-repo
          
          # Copy updated files
          cp ../PKGBUILD .
          cp ../.SRCINFO .
          
          # Commit and push
          git add PKGBUILD .SRCINFO
          git commit -m "Update to version ${{ steps.version.outputs.VERSION }}" || echo "No changes to commit"
          git push origin master || git push origin HEAD:master
